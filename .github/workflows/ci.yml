# .github/workflows/ci.yml
#
# Continuous Integration pipeline for task-api.
#
# Four parallel jobs on every push and PR to main:
#   - lint:     ESLint
#   - test:     migrations + full test suite against PostgreSQL
#   - build:    verify the production Docker image builds
#   - security: scan the Docker image for known vulnerabilities (Trivy)
#
# The security job fails the build only on HIGH or CRITICAL severity findings.
# Lower-severity findings are reported but don't block.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------
  # Job 1: Lint
  # -----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  # -----------------------------------------------------------------
  # Job 2: Test
  # -----------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskdb_test
      JWT_SECRET: ci-test-secret-not-used-in-production
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate:up

      - name: Run tests with coverage
        run: npm run test:coverage

  # -----------------------------------------------------------------
  # Job 3: Build
  # -----------------------------------------------------------------
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: task-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # Job 4: Security Scan
  # Builds the image and scans it with Trivy.
  # Fails the build on HIGH or CRITICAL severity findings.
  # -----------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image locally so Trivy can scan it. Tagged with a
      # CI-only name; not pushed anywhere.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: task-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step A: Run Trivy with full output (informational — never fails the job).
      # Shows everything in the CI log so we can see what's there.
      - name: Trivy scan (all severities, informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:scan
          format: table
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'      # never fail on this step
          ignore-unfixed: false

      # Step B: Re-scan, this time only HIGH/CRITICAL, fails the job if any found.
      # This is what controls whether the security job is green or red.
      - name: Trivy scan (HIGH/CRITICAL, fails build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:scan
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'      # fail the job if any HIGH/CRITICAL found
          ignore-unfixed: true  # don't fail on issues with no available fix